[package]
name = "rvsystem_monitor"
version = "0.8.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.22.4"
log = "0.4"
android_logger = "0.15"
once_cell = "1.19"
libc = "0.2"

[[bin]]
name = "bench"
path = "src/bench_bin.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
